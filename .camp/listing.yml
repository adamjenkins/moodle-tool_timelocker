name: tool_timelocker
summary: 'An admin tool that bulk-schedules gradebook lock-after dates across a course''s gradable activities on a timed-session basis.'
description: |
  Pick a module type (quizzes, assignments — any activity with a gradebook
  grade item), split its activities into sessions, and the tool writes each
  session's lock date straight into the grade items' native `locktime`.
  Core's grade-lock enforcement takes it from there — no custom locking
  engine involved.
